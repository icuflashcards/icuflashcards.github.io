    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  let newPerSession = store.get('newPerSession', 20);
  // Objetivos: número de cartões (0 = sem objetivo). Conta um cartão quando sai da sessão (qualquer resposta exceto "De novo").
  const NO_GOALS = { session: 0, day: 0, week: 0, month: 0 };
  let goals = { ...NO_GOALS }, studyLog = {}, statsLoaded = false, statsTimer = null;

  // ---------- utilitários ----------
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/_(.+?)_/g, '<em>$1</em>');
  function md(s) {
    const lines = esc(s).split('\n'); let out = '', inList = false;
    for (const ln of lines) {
      const m = ln.match(/^\s*[-•]\s+(.*)/);
      if (m) { if (!inList) { out += '<ul>'; inList = true; } out += '<li>' + inline(m[1]) + '</li>'; }
      else { if (inList) { out += '</ul>'; inList = false; } out += ln.trim() ? '<div>' + inline(ln) + '</div>' : '<div>&nbsp;</div>'; }
    }
    return out + (inList ? '</ul>' : '');
  }
  const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);
  const fmtDate = t => t ? new Date(t).toLocaleDateString('pt-PT', { day: 'numeric', month: 'short' }) : '';
  const rid = () => Math.random().toString(36).slice(2, 10);
  const nameOf = id => { const p = profiles.find(x => x.id === id); return (p && p.name) || (id === (me && me.id) ? 'Tu' : 'Interno'); };
  const $ = id => document.getElementById(id);
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };

  function showToast(html, actionLabel, action) {
    clearTimeout(toastTimer);
    toastEl.innerHTML = `<span>${html}</span>${actionLabel ? `<button id="toastBtn">${actionLabel}</button>` : ''}`;
    toastEl.hidden = false;
    const b = $('toastBtn'); if (b) b.onclick = () => { toastEl.hidden = true; action(); };
    toastTimer = setTimeout(() => { toastEl.hidden = true; }, 7000);
  }
  function errMsg(e) {
    const m = (e && (e.message || e.error_description)) || '';
    if (/Invalid login credentials/i.test(m)) return 'Email ou palavra-passe errados.';
    if (/Email not confirmed/i.test(m)) return 'Ainda não confirmaste o email. Abre a mensagem que te enviámos.';
    if (/already registered|already exists/i.test(m)) return 'Já existe uma conta com este email. Entra ou recupera a palavra-passe.';
    if (/Password should be/i.test(m)) return 'A palavra-passe tem de ter pelo menos 6 caracteres.';
    if (/rate limit|too many/i.test(m)) return 'Demasiadas tentativas seguidas. Espera uns minutos.';
    if (/Failed to fetch|NetworkError/i.test(m)) return 'Sem ligação à internet.';
    return 'Algo correu mal. Tenta de novo.' + (m ? ` (${m})` : '');
  }

  // ---------- repetição espaçada ----------
  const startOfDay = t => { const d = new Date(t); d.setHours(4, 0, 0, 0); if (new Date(t).getHours() < 4) d.setDate(d.getDate() - 1); return d.getTime(); };
  function next(p, g) {
    const now = Date.now();
    p = p ? { ...p } : { i: 0, e: 2.5, r: 0, l: 0 };
    if (g === 0) { p.l++; p.r = 0; p.i = 0; p.e = Math.max(1.3, p.e - 0.2); p.due = now + 10 * 60000; return p; }
    if (g === 1) { p.i = p.r === 0 ? 1 : Math.max(p.i + 1, Math.round(p.i * 1.2)); p.e = Math.max(1.3, p.e - 0.15); }
    // 1.ª resposta (ou depois de "De novo"): Difícil 1 d, Bem 4 d, Fácil 7 d; depois os intervalos crescem
    if (g === 2) { p.i = p.r === 0 ? 4 : Math.max(p.i + 1, Math.round(p.i * p.e)); }
    if (g === 3) { p.i = p.r === 0 ? 7 : Math.max(p.i + 2, Math.round(p.i * p.e * 1.3)); p.e += 0.15; }
    p.r++; p.due = startOfDay(now) + p.i * DAY; return p;
  }
  function fmtInt(p) {
    if (!p.i) return '10 min';
    if (p.i < 7) return p.i + ' d';
    if (p.i < 30) return Math.round(p.i / 7) + ' sem';
    if (p.i < 365) { const m = Math.round(p.i / 30); return m + (m > 1 ? ' meses' : ' mês'); }
    return (p.i / 365).toFixed(1).replace('.0', '') + ' ano';
  }
  function cardState(p) {
    if (!p) return 'novo';
    if (p.due <= Date.now()) return 'para rever';
    const days = Math.round((p.due - startOfDay(Date.now())) / DAY);
    return days <= 0 ? 'hoje' : 'daqui a ' + days + ' d';
  }

  // ---------- objetivos ----------
  // O dia de estudo começa às 4h (como as revisões); a semana começa à segunda-feira.
  const pad2 = n => String(n).padStart(2, '0');
  const keyOf = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  const studyDay = (t = Date.now()) => new Date(startOfDay(t));
  const todayKey = () => keyOf(studyDay());
  function weekDays(t = Date.now()) {
    const d = studyDay(t), back = (d.getDay() + 6) % 7, out = [];
    for (let i = 0; i < 7; i++) { const x = new Date(d); x.setDate(d.getDate() - back + i); out.push(keyOf(x)); }
    return out;
  }
  function periodCounts() {
    const tk = todayKey(), wk = weekDays(), mk = tk.slice(0, 7); let week = 0, month = 0;
    for (const [k, n] of Object.entries(studyLog)) { if (wk.includes(k)) week += n; if (k.startsWith(mk)) month += n; }
    return { day: studyLog[tk] || 0, week, month };
  }
  const PERIODS = [{ k: 'day', label: 'Hoje' }, { k: 'week', label: 'Esta semana' }, { k: 'month', label: 'Este mês' }];
  const hasGoals = () => goals.session || goals.day || goals.week || goals.month;
  function goalRow(label, n, g) {
    const met = n >= g, pct = Math.min(100, g ? n / g * 100 : 0);
    return `<div class="goal ${met ? 'met' : ''}"><span class="g-label">${label}</span>
      <span class="g-val">${met ? 'cumprido · ' : ''}<b>${n}</b> / ${g}</span>
      <span class="gbar" role="progressbar" aria-valuemin="0" aria-valuemax="${g}" aria-valuenow="${Math.min(n, g)}" aria-label="${label}"><i style="width:${pct}%"></i></span></div>`;
  }
  function saveStats() {
    if (!me) return;
    store.set('stats:' + me.id, { goals, log: studyLog });
    clearTimeout(statsTimer);
    statsTimer = setTimeout(async () => {
      const { error } = await sb.from('study_stats').upsert({ user_id: me.id, goals, log: studyLog, updated_at: new Date().toISOString() });
      if (error) console.warn('objetivos não gravados', error);
    }, 1200);
  }
  function logCard() {
    const before = periodCounts(), k = todayKey();
    studyLog = { ...studyLog, [k]: (studyLog[k] || 0) + 1 };
    const cut = keyOf(new Date(Date.now() - 400 * DAY));   // guarda só os últimos ~13 meses
    for (const key of Object.keys(studyLog)) if (key < cut) delete studyLog[key];
    saveStats();
    const after = periodCounts();
    const hit = PERIODS.filter(p => goals[p.k] && before[p.k] < goals[p.k] && after[p.k] >= goals[p.k]);
    if (hit.length) {
      const big = hit[hit.length - 1].k;
      showToast({ day: 'Objetivo de hoje cumprido', week: 'Objetivo da semana cumprido', month: 'Objetivo do mês cumprido' }[big] + ` (${goals[big]} cartões)`);
    }
  }

  // ---------- pesquisa e seleção ----------
  const norm = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const filt = { home: { q: '', src: '' }, lib: { q: '', src: '' } };
  const sel = { home: new Set(), lib: new Set() };
  const sourcesOf = list => [...new Set(list.map(b => b.source_title || '').filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt'));
  function matches(b, f) {
    if (f.src && (b.source_title || '') !== f.src) return false;
    if (!f.q.trim()) return true;
    const hay = norm([b.title, b.topic, b.source_title, b.source_detail].join(' '));
    return norm(f.q).split(/\s+/).filter(Boolean).every(w => hay.includes(w));
  }
  function filtersHtml(key, list) {
    const f = filt[key], srcs = sourcesOf(list);
    return `<div class="filters"><input id="fq_${key}" type="search" placeholder="Pesquisar por fonte, tema ou bloco" value="${esc(f.q)}" autocomplete="off">
      <select id="fs_${key}" aria-label="Filtrar por fonte"><option value="">Todas as fontes</option>${srcs.map(x => `<option ${x === f.src ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div>`;
  }
  function bindFilters(key) {
    const q = $('fq_' + key), sr = $('fs_' + key);
    if (q) q.oninput = () => { filt[key].q = q.value; const pos = q.selectionStart; render(); const n = $('fq_' + key); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch {} } };
    if (sr) sr.onchange = () => { filt[key].src = sr.value; render(); };
  }

  // ---------- derivados ----------
  const visibleBlocks = () => blocks.filter(b => !b.hidden || devMode);
  const myBlocks = () => blocks.filter(b => imported.includes(b.id) && !b.hidden);
  const isArch = (b, c) => (myArchive[b.id] || []).includes(c.id);
  const activeCards = b => (b.cards || []).filter(c => !isArch(b, c));
  const archivedCards = b => (b.cards || []).filter(c => isArch(b, c));
  const topicsOf = list => { const g = {}; list.forEach(b => (g[b.topic || 'Outros'] ||= []).push(b)); return Object.entries(g).sort((a, b) => a[0].localeCompare(b[0], 'pt')); };
  const sourceLine = b => [b.source_title, b.source_detail].filter(Boolean).join(' · ');
  function blockStats(b) {
    const pr = progress[b.id] || {}, now = Date.now(); let nw = 0, due = 0, learn = 0, mastered = 0;
    const cards = activeCards(b);
    for (const c of cards) { const p = pr[c.id]; if (!p) { nw++; continue; } if (p.due <= now) due++; if (p.i >= 21) mastered++; else learn++; }
    return { total: cards.length, nw, due, learn, mastered };
  }

  // ---------- dados ----------
  async function loadAll() {
    const uid = me.id;
    const q = await Promise.all([
      sb.from('blocks').select('*').order('created_at'),
      sb.from('user_blocks').select('block_id').eq('user_id', uid),
      sb.from('progress').select('block_id,cards').eq('user_id', uid),
      sb.from('archives').select('block_id,card_ids').eq('user_id', uid),
      sb.from('submissions').select('*').eq('author', uid).order('created_at', { ascending: false }),
      sb.from('profiles').select('id,name,role,approved,created_at').order('created_at')
    ]);
    const err = q.find(r => r.error); if (err) throw err.error;
    blocks = q[0].data || [];
    imported = (q[1].data || []).map(r => r.block_id);
    progress = {}; (q[2].data || []).forEach(r => { progress[r.block_id] = r.cards || {}; });
    // progresso que ficou por gravar (sem rede) tem prioridade
    const pending = store.get('pendingProgress:' + uid, {});
    Object.entries(pending).forEach(([bid, cards]) => { progress[bid] = cards; dirty.add(bid); });
    if (dirty.size) scheduleSave(500);
    myArchive = {}; (q[3].data || []).forEach(r => { myArchive[r.block_id] = r.card_ids || []; });
    mySubs = q[4].data || [];
    profiles = q[5].data || [];
    if (me.role === 'developer') {
      const r = await sb.from('submissions').select('*').order('created_at', { ascending: false });
      allSubs = r.data || [];
    }
    if (!statsLoaded) {
      const st = await sb.from('study_stats').select('goals,log').eq('user_id', uid).maybeSingle();
      const local = store.get('stats:' + uid, null);
      const row = (!st.error && st.data) ? st.data : local;
      if (row) { goals = { ...NO_GOALS, ...(row.goals || {}) }; studyLog = row.log || {}; }
      if (!st.error && !st.data && local) saveStats();   // primeira vez: sobe o que estava no aparelho
      statsLoaded = true;
    }
    loadedData = true;
  }
  async function refresh(silent) {
    try { await loadAll(); if (!silent) render(); } catch (e) { if (!silent) showToast(errMsg(e)); }
  }

  function scheduleSave(ms = 1500) { clearTimeout(saveTimer); saveTimer = setTimeout(flushProgress, ms); }
  async function flushProgress() {
    if (!me || !dirty.size) return;
    const ids = [...dirty]; dirty.clear();
    const rows = ids.map(bid => ({ user_id: me.id, block_id: bid, cards: progress[bid] || {}, updated_at: new Date().toISOString() }));
    const { error } = await sb.from('progress').upsert(rows);
    if (error) { ids.forEach(id => dirty.add(id)); }
    const pend = {}; dirty.forEach(id => { pend[id] = progress[id]; });
    store.set('pendingProgress:' + me.id, pend);
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushProgress(); });
  window.addEventListener('online', () => { if (dirty.size) flushProgress(); });

  // ---------- ações do utilizador ----------
  async function importBlocks(ids) {
    const add = ids.filter(id => !imported.includes(id)); if (!add.length) return;
    imported = [...imported, ...add]; render();
    const { error } = await sb.from('user_blocks').upsert(add.map(id => ({ user_id: me.id, block_id: id })));
    if (error) { imported = imported.filter(x => !add.includes(x)); render(); return showToast(errMsg(error)); }
    showToast(add.length === 1 ? 'Bloco importado' : plural(add.length, 'bloco importado', 'blocos importados'));
  }
  async function removeBlock(id) {
    imported = imported.filter(x => x !== id); render();
    const { error } = await sb.from('user_blocks').delete().eq('user_id', me.id).eq('block_id', id);
    if (error) { imported.push(id); render(); return showToast(errMsg(error)); }
    showToast('Bloco removido dos teus blocos. O progresso fica guardado.', 'Anular', () => importBlocks([id]));
  }
  async function setArchived(blockId, cardId, value, withUndo = true) {
    const set = new Set(myArchive[blockId] || []); value ? set.add(cardId) : set.delete(cardId);
    const prev = myArchive[blockId];
    myArchive = { ...myArchive, [blockId]: [...set] };
    if (value && session) {
      const cur = session.queue[0], before = session.queue.length;
      session.queue = session.queue.filter(it => !(it.b.id === blockId && it.c.id === cardId));
      session.total -= Math.min(1, before - session.queue.length);
      if (cur && cur.c.id === cardId) session.flipped = false;
    }
    render();
    const { error } = set.size
      ? await sb.from('archives').upsert({ user_id: me.id, block_id: blockId, card_ids: [...set], updated_at: new Date().toISOString() })
      : await sb.from('archives').delete().eq('user_id', me.id).eq('block_id', blockId);
    if (error) { myArchive = { ...myArchive, [blockId]: prev || [] }; render(); return showToast(errMsg(error)); }
    if (value) showToast('Cartão arquivado', withUndo ? 'Anular' : null, () => setArchived(blockId, cardId, false, false));
    else showToast('Cartão reposto no bloco');
  }

  // ---------- autenticação ----------
  async function startSession(s) {
    if (!s || !s.user) { me = null; view = { name: 'auth', mode: view.mode === 'recover' ? 'recover' : 'login' }; return render(); }
    const { data: prof, error } = await sb.from('profiles').select('*').eq('id', s.user.id).maybeSingle();
    if (error || !prof) { me = { id: s.user.id, email: s.user.email, approved: false, role: 'user', name: '' }; view = { name: 'pending' }; return render(); }
    if (!me || me.id !== s.user.id) { statsLoaded = false; goals = { ...NO_GOALS }; studyLog = {}; }
    me = { ...prof, email: s.user.email };
    if (!me.approved) { view = { name: 'pending' }; return render(); }
    devMode = me.role === 'developer' && store.get('devMode', true) !== false;
    if (!['home','library','block','archive','submit','dev','goals'].includes(view.name)) view = { name: 'home' };
    render();
    await refresh(true); render();
  }

  function renderAuth() {
    const mode = view.mode || 'login';

    if (mode !== 'reset') html += `<div class="field"><label for="a_pass">${mode === 'recover' ? 'Nova palavra-passe' : 'Palavra-passe'}</label><input id="a_pass" type="password" autocomplete="${mode === 'login' ? 'current-password' : 'new-password'}" required minlength="6"></div>`;
    html += `<button class="btn btn-primary" type="submit" id="authBtn" ${sb ? '' : 'disabled'}>${{ login: 'Entrar', signup: 'Criar conta', reset: 'Enviar email de recuperação', recover: 'Guardar palavra-passe' }[mode]}</button></form>
      <div class="row" style="justify-content:space-between">
        ${mode === 'login' ? `<button class="linkbtn" id="toSignup">Ainda não tenho conta</button><button class="linkbtn" id="toReset">Esqueci-me da palavra-passe</button>` : ''}
        ${mode === 'signup' || mode === 'reset' ? `<button class="linkbtn" id="toLogin">Já tenho conta: entrar</button>` : ''}
      </div>

    on('toReset', () => { view = { name: 'auth', mode: 'reset', email: ($('a_email') || {}).value }; render(); });
    on('toLogin', () => { view = { name: 'auth', mode: 'login' }; render(); });
    $('authForm').onsubmit = async e => {
      e.preventDefault(); const btn = $('authBtn'); btn.disabled = true;
      const email = ($('a_email') || {}).value?.trim(), pass = ($('a_pass') || {}).value, name = ($('a_name') || {}).value?.trim();
      try {
        if (mode === 'login') {
          const { error } = await sb.auth.signInWithPassword({ email, password: pass }); if (error) throw error;
        } else if (mode === 'signup') {
          if (!name) throw { message: 'Indica o teu nome.' };
          const { data, error } = await sb.auth.signUp({ email, password: pass, options: { data: { name }, emailRedirectTo: location.origin + location.pathname } });
          if (error) throw error;
          if (!data.session) { view = { name: 'auth', mode: 'login', email, msg: 'Conta criada. Confirma o email (vê a caixa de entrada) e depois entra aqui.', msgOk: true }; render(); }
        } else if (mode === 'reset') {
          const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname }); if (error) throw error;

      }
    };
  }

  function renderPending() {
    app.innerHTML = `<div class="auth wrap" style="padding:0;gap:22px">
      <div class="brand"><span class="brand-card" aria-hidden="true"></span><div><h2>ICU Flashcards</h2><h1>Conta à espera de aprovação</h1></div></div>
      <div class="panel"><p>Olá${me && me.name ? ', ' + esc(me.name) : ''}. A tua conta (${esc(me && me.email)}) foi criada. Assim que o João a aprovar, consegues entrar na biblioteca e começar a estudar.</p></div>
      <div class="row"><button class="btn btn-primary" id="recheck">Verificar outra vez</button><button class="btn btn-ghost" id="logout">Sair</button></div></div>`;
    on('recheck', async () => { const { data } = await sb.auth.getSession(); startSession(data.session); });
    on('logout', () => sb.auth.signOut());
  }

  // ---------- vistas ----------
  function go(v) { view = v; render(); scrollTo(0, 0); }
  function render() {
    const r = { auth: renderAuth, pending: renderPending, home: renderHome, block: renderBlock, study: renderStudy, done: renderDone,
      archive: renderArchive, library: renderLibrary, submit: renderSubmit, dev: renderDev, goals: renderGoals }[view.name];
    (r || renderHome)();
    const bk = $('back'); if (bk) bk.onclick = () => go(view.backTo || { name: 'home' });
  }
  const back = (label = '← Início') => `<button class="back" id="back">${label}</button>`;

  function renderHome() {
    const mine = myBlocks();
    let totDue = 0, totNew = 0, totAll = 0;
    mine.forEach(b => { const s = blockStats(b); totDue += s.due; totNew += Math.min(s.nw, newPerSession); totAll += s.total; });
    let html = `<div class="top"><div><h2>ICU Flashcards${me.name ? ' · ' + esc(me.name) : ''}</h2><h1>Os teus blocos</h1></div>
      ${mine.length ? `<div class="today"><div><b>${totDue}</b><span>para rever</span></div><div><b>${totNew}</b><span>novos hoje</span></div><div><b>${totAll}</b><span>cartões</span></div></div>` : ''}</div>`;
    if (devMode) {
      const np = allSubs.filter(s => s.status === 'pending').length, na = profiles.filter(p => !p.approved).length;
      html += `<div class="dev-band"><div class="group-head"><h2>Modo developer</h2><button class="btn btn-ghost btn-sm" id="asUser">Ver como utilizador</button></div>

  // ---------- estudo ----------
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function startStudy(list, everything) {
    const now = Date.now(), dueQ = [], newQ = [];
    for (const b of list) {
      const pr = progress[b.id] || {}; let n = 0;
      for (const c of activeCards(b)) {
        const p = pr[c.id];
        if (everything) { (p ? dueQ : newQ).push({ b, c }); continue; }
        if (!p) { if (n < newPerSession) { newQ.push({ b, c }); n++; } } else if (p.due <= now) dueQ.push({ b, c });
      }
    }
    const queue = [...shuffle(dueQ), ...newQ]; if (!queue.length) return;
    session = { queue, total: queue.length, doneCount: 0, flipped: false, tally: [0, 0, 0, 0], back: view };
    go({ name: 'study' });
  }
  function renderStudy() {
    const item = session.queue[0]; if (!item) { view = { name: 'done' }; return render(); }
    if (session.goalPause) {
      const c0 = periodCounts();
      app.innerHTML = `<div class="wrap done" style="padding:0"><h2>Objetivo da sessão cumprido</h2><h1>${plural(session.doneCount, 'cartão revisto', 'cartões revistos')}</h1>
        <p class="muted">${plural(session.queue.length, 'cartão continua', 'cartões continuam')} pendente${session.queue.length === 1 ? '' : 's'} nesta sessão.</p>
        ${goals.day ? `<div class="goals" style="width:100%;text-align:left">${goalRow('Hoje', c0.day, goals.day)}</div>` : ''}
        <div class="row" style="width:100%"><button class="btn btn-primary" id="goOn">Continuar a estudar</button><button class="btn btn-ghost" id="stop">Terminar aqui</button></div></div>`;
      on('goOn', () => { session.goalPause = false; render(); });
      on('stop', () => { view = { name: 'done' }; render(); });
      return;
    }
    const sg = goals.session;
    const { b, c } = item, p = (progress[b.id] || {})[c.id];
    const pct = session.total ? session.doneCount / session.total * 100 : 100;
    app.innerHTML = `<div class="study-head"><button class="close" id="quit" aria-label="Terminar sessão">✕</button>
        <div class="progress"><i style="width:${pct}%"></i></div><span class="num muted">${session.doneCount}/${session.total}</span></div>
      ${sg ? `<div class="sess-goal ${session.doneCount >= sg ? 'met' : ''}"><span>Objetivo da sessão</span><span class="num">${session.doneCount >= sg ? 'cumprido · ' : ''}${session.doneCount} / ${sg}</span></div>` : ''}
      <article class="flash" id="flash" tabindex="0">
        <div class="flash-top"><span class="deck-label">${esc(b.title)}</span><span class="right"><span>${p ? cardState(p) : 'novo'}</span>
          <button class="trash" id="trash" aria-label="Arquivar este cartão" title="Arquivar este cartão">${ICON.archive}</button></span></div>
        <div class="flash-body">
          <div class="q"><span class="baseline-probe" id="probe"></span>${md(c.q).replace(/^<div>/, '<span>').replace(/<\/div>/, '</span>')}</div>
          ${session.flipped ? `<div class="a">${md(c.a)}</div>${c.note ? `<div class="note">${md(c.note)}</div>` : ''}` : `<div class="hint">Toca no cartão para ver a resposta</div>`}
        </div></article>
      ${session.flipped ? `<div class="grades">${['De novo', 'Difícil', 'Bem', 'Fácil'].map((l, g) => `<button class="grade" data-g="${g}">${l}<small>${fmtInt(next(p, g))}</small></button>`).join('')}</div>`
        : `<button class="btn reveal" id="flip">Mostrar resposta</button>`}`;
    on('quit', endStudy);
    const flip = () => { if (!session.flipped) { session.flipped = true; render(); } };
    $('flash').onclick = flip; on('flip', flip);
    $('trash').onclick = e => { e.stopPropagation(); setArchived(b.id, c.id, true); };
    app.querySelectorAll('.grade').forEach(el => el.onclick = () => grade(+el.dataset.g));
    alignRules();
  }
  function alignRules() {
    const body = app.querySelector('.flash-body'), probe = $('probe'); if (!body || !probe) return;
    const lh = 32, baseline = probe.getBoundingClientRect().top - body.getBoundingClientRect().top;
    body.style.setProperty('--rule-off', ((((baseline + 3 - (lh - 1)) % lh) + lh) % lh) + 'px');
  }
  window.addEventListener('resize', alignRules);
  try { document.fonts && document.fonts.ready.then(alignRules); } catch {}
  function grade(g) {
    const item = session.queue.shift(), { b, c } = item;
    const pr = progress[b.id] ||= {}; pr[c.id] = next(pr[c.id], g);
    session.tally[g]++;
    if (g === 0) session.queue.splice(Math.min(3, session.queue.length), 0, item);
    else {
      session.doneCount++; logCard();
      if (goals.session && session.doneCount === goals.session && session.queue.length) session.goalPause = true;
    }
    session.flipped = false;
    dirty.add(b.id); store.set('pendingProgress:' + me.id, Object.fromEntries([...dirty].map(id => [id, progress[id]]))); scheduleSave();
    render();
  }
  function endStudy() { flushProgress(); const v = session.back.name === 'block' ? session.back : { name: 'home' }; session = null; go(v); }
  function renderDone() {
    const t = session.tally;
    app.innerHTML = `<div class="wrap done" style="padding:0"><h2>Sessão terminada</h2><h1>${plural(session.doneCount, 'cartão revisto', 'cartões revistos')}</h1>
      <div class="stats" style="width:100%"><div><b style="color:var(--again)">${t[0]}</b><span>de novo</span></div><div><b style="color:var(--hard)">${t[1]}</b><span>difícil</span></div><div><b style="color:var(--good)">${t[2]}</b><span>bem</span></div><div><b style="color:var(--easy)">${t[3]}</b><span>fácil</span></div></div>
      ${PERIODS.some(p => goals[p.k]) ? (() => { const c0 = periodCounts(); return `<div class="goals" style="width:100%;text-align:left">${PERIODS.filter(p => goals[p.k]).map(p => goalRow(p.label, c0[p.k], goals[p.k])).join('')}</div>`; })() : ''}
      <button class="btn btn-primary" id="fin" style="width:100%">Voltar</button></div>`;
    on('fin', endStudy);
  }
  document.addEventListener('keydown', e => {
    if (view.name !== 'study' || !session || session.goalPause) return;
    if (!session.flipped && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); session.flipped = true; render(); }
    else if (session.flipped && ['1','2','3','4'].includes(e.key)) grade(+e.key - 1);
  });

  // ---------- envio de PDF ----------
  function renderSubmit() {
    const topics = [...new Set(blocks.map(b => b.topic).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt'));
    const f = view.form || {};
    const label = { pending: 'a aguardar', approved: 'publicado', rejected: 'rejeitado' };
    app.innerHTML = `${back()}<div><h2>ICU Flashcards</h2><h1>Enviar PDF para gerar cartões</h1>
      <p class="muted" style="margin-top:6px">Envia o PDF e indica o tema e a fonte. O João gera os cartões com o Claude, valida-os e publica o bloco na biblioteca para todos.</p></div>
      <form class="form panel" id="subForm" novalidate>
        <div class="field"><label for="s_pdf">Ficheiro PDF</label><input type="file" id="s_pdf" accept="application/pdf"><span class="hint-t">Até 50 MB.</span></div>
        <div class="field"><label for="s_title">Nome do bloco</label><input id="s_title" placeholder="Ex.: Ventilação protetora no ARDS" value="${esc(f.title || '')}"></div>
        <div class="field"><label for="s_topic">Tema</label><input id="s_topic" list="topicList" placeholder="Escolhe um tema existente ou escreve um novo" value="${esc(f.topic || '')}">
          <datalist id="topicList">${topics.map(t => `<option value="${esc(t)}">`).join('')}</datalist></div>
        <div class="field"><label for="s_src">Fonte: livro ou documento</label><input id="s_src" placeholder="Ex.: Oh's Intensive Care Manual" value="${esc(f.src || '')}"></div>
        <div class="two"><div class="field"><label for="s_srcd">Edição e capítulo</label><input id="s_srcd" placeholder="Ex.: 8.ª ed., cap. 31" value="${esc(f.srcd || '')}"></div>
          <div class="field"><label for="s_pages">Páginas a usar</label><input id="s_pages" placeholder="Ex.: 412–425, ou todas" value="${esc(f.pages || '')}"></div></div>
        <div class="field"><label for="s_msg">Nota para o João (opcional)</label><input id="s_msg" placeholder="Ex.: focar em doses e critérios" value="${esc(f.msg || '')}"></div>
        <button class="btn btn-primary" type="submit" id="subBtn">Enviar</button></form>
      ${mySubs.length ? `<section class="group"><h2>Os teus envios</h2><div class="decks">${mySubs.map(s => `<div class="deck"><span class="deck-name">${esc(s.title)}</span>
        <span class="pill ${s.status}">${label[s.status] || s.status}</span>
        <span class="deck-meta"><span>${esc(s.topic)}</span><span>${fmtDate(s.created_at)}</span>${s.review_note ? `<span>Nota: ${esc(s.review_note)}</span>` : ''}</span></div>`).join('')}</div></section>` : ''}`;
    $('subForm').onsubmit = async e => {
      e.preventDefault();
      const file = $('s_pdf').files[0];
      const form = { title: $('s_title').value.trim(), topic: $('s_topic').value.trim(), src: $('s_src').value.trim(), srcd: $('s_srcd').value.trim(), pages: $('s_pages').value.trim(), msg: $('s_msg').value.trim() };
      view.form = form;
      if (!file) return showToast('Escolhe o ficheiro PDF.');
      if (file.size > 52428800) return showToast('O PDF tem mais de 50 MB. Envia só o capítulo.');
      if (!form.title || !form.topic || !form.src) return showToast('Preenche o nome do bloco, o tema e a fonte.');
      const btn = $('subBtn'); btn.disabled = true; btn.textContent = 'A enviar…';
      const id = crypto.randomUUID(), path = `${me.id}/${id}.pdf`;
      const up = await sb.storage.from('submissions').upload(path, file, { contentType: 'application/pdf' });
      if (up.error) { btn.disabled = false; btn.textContent = 'Enviar'; return showToast(errMsg(up.error)); }
      const { data, error } = await sb.from('submissions').insert({ id, author: me.id, title: form.title, topic: form.topic, source_title: form.src,
        source_detail: form.srcd, pages: form.pages, message: form.msg, pdf_path: path }).select().single();
      if (error) { btn.disabled = false; btn.textContent = 'Enviar'; return showToast(errMsg(error)); }
      mySubs = [data, ...mySubs]; view = { name: 'submit' }; render(); showToast('PDF enviado. Vais ver aqui quando o bloco for publicado.');
    };
  }

  // ---------- painel developer ----------
  function parseCards(text) {
    let data; try { data = JSON.parse(text); } catch { throw new Error('O texto colado não é JSON válido. Copia o bloco completo que o Claude te deu.'); }
    const meta = Array.isArray(data) ? {} : data;
    const list = Array.isArray(data) ? data : data.cards;
    if (!Array.isArray(list) || !list.length) throw new Error('Não encontrei cartões no texto colado.');
    const used = new Set();
    const cards = list.map(c => {
      if (!c || !c.q || !c.a) throw new Error('Há cartões sem pergunta (q) ou sem resposta (a).');
      let id = c.id ? String(c.id) : 'c' + rid(); while (used.has(id)) id = 'c' + rid(); used.add(id);
      return { id, q: String(c.q).trim(), a: String(c.a).trim(), ...(c.note ? { note: String(c.note).trim() } : {}) };
    });
    const src = meta.source || {};
    return { cards, title: meta.title || '', topic: meta.topic || '', srcTitle: src.title || meta.source_title || '', srcDetail: src.detail || meta.source_detail || '' };
  }

  function renderDev() {
    if (!devMode) return go({ name: 'home' });
    const tab = view.tab || 'subs';
    const pend = allSubs.filter(s => s.status === 'pending'), waiting = profiles.filter(p => !p.approved);
    let html = `${back()}<div><h2>Modo developer</h2><h1>Painel</h1></div>
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="${tab === 'subs'}" data-tab="subs">Envios${pend.length ? ` (${pend.length})` : ''}</button>
        <button role="tab" aria-selected="${tab === 'users'}" data-tab="users">Contas${waiting.length ? ` (${waiting.length})` : ''}</button>
        <button role="tab" aria-selected="${tab === 'new'}" data-tab="new">Publicar cartões</button></div>`;

    if (tab === 'subs') {
      if (!pend.length) html += `<div class="empty"><h3>Nada por tratar</h3><p class="muted">Os PDFs que os internos enviarem aparecem aqui.</p></div>`;
      for (const s of pend) html += `<div class="panel"><div class="group-head"><h3>${esc(s.title)}</h3><span class="pill pending">a aguardar</span></div>
        <p class="small muted">${esc(s.topic)} · Fonte: ${esc([s.source_title, s.source_detail].filter(Boolean).join(' · '))}${s.pages ? ` · páginas ${esc(s.pages)}` : ''}<br>
          Enviado por ${esc(nameOf(s.author))} · ${fmtDate(s.created_at)}${s.message ? `<br>Nota: ${esc(s.message)}` : ''}</p>
        <div class="row"><button class="btn btn-ghost btn-sm" data-pdf="${esc(s.id)}">Abrir o PDF</button>
          <button class="btn btn-primary btn-sm" data-gen="${esc(s.id)}">Colar cartões e publicar</button></div>
        <div class="field"><label for="note_${esc(s.id)}">Nota se rejeitares</label><input id="note_${esc(s.id)}"></div>
        <button class="btn btn-ghost btn-sm" style="align-self:flex-start" data-reject="${esc(s.id)}">Rejeitar</button></div>`;
      const done = allSubs.filter(s => s.status !== 'pending').slice(0, 15);
      if (done.length) html += `<section class="group"><h2>Já tratados</h2><div class="decks">${done.map(s => `<div class="deck"><span class="deck-name">${esc(s.title)}</span>
        <span class="pill ${s.status}">${s.status === 'approved' ? 'publicado' : 'rejeitado'}</span><span class="deck-meta"><span>${esc(nameOf(s.author))}</span><span>${fmtDate(s.reviewed_at || s.created_at)}</span></span></div>`).join('')}</div></section>`;
    }

    if (tab === 'users') {
      html += `<p class="muted small">Contas novas ficam à espera até as aprovares. Para dar acesso a alguém, pede-lhe que crie conta na app e aprova aqui.</p>`;
      if (waiting.length) html += `<section class="group"><h2>À espera de aprovação</h2><div class="decks">${waiting.map(p => `<div class="deck"><span class="deck-name">${esc(p.name || 'Sem nome')}</span>
        <span class="pill pending">pendente</span><span class="deck-meta"><span>Criada a ${fmtDate(p.created_at)}</span></span>
        <span class="deck-actions"><button class="btn btn-primary btn-sm" data-approve="${esc(p.id)}">Aprovar</button></span></div>`).join('')}</div></section>`;
      const ok = profiles.filter(p => p.approved);
      html += `<section class="group"><h2>Com acesso · ${ok.length}</h2><div class="decks">${ok.map(p => `<div class="deck"><span class="deck-name">${esc(p.name || 'Sem nome')}${p.id === me.id ? ' (tu)' : ''}</span>
        <span class="pill ${p.role === 'developer' ? 'due' : 'plain'}">${p.role === 'developer' ? 'developer' : 'utilizador'}</span>
        ${p.id === me.id ? '' : `<span class="deck-actions"><button class="btn btn-ghost btn-sm" data-revoke="${esc(p.id)}">${view.confirmRevoke === p.id ? 'Confirmar: retirar acesso' : 'Retirar acesso'}</button></span>`}</div>`).join('')}</div></section>`;
    }

    if (tab === 'new') {
      const sub = view.sub ? allSubs.find(s => s.id === view.sub) : null;
      const target = view.target ? blocks.find(b => b.id === view.target) : null;
      const pv = view.preview;
      html += `<div class="panel small">${target ? `Vais acrescentar cartões ao bloco <b>${esc(target.title)}</b>. Os cartões que já existem e o progresso de todos ficam como estão.`
        : sub ? `A publicar o envio <b>${esc(sub.title)}</b> de ${esc(nameOf(sub.author))}. Os dados do bloco já vêm preenchidos.`
        : `Cola aqui o JSON com os cartões que o Claude gerar na conversa. Se o JSON trouxer o nome, o tema e a fonte, os campos preenchem-se sozinhos.`}</div>
      <form class="form" id="newForm" novalidate>
        ${target ? '' : `<div class="field"><label for="n_title">Nome do bloco</label><input id="n_title" value="${esc(pv ? pv.title : sub ? sub.title : '')}"></div>
        <div class="field"><label for="n_topic">Tema</label><input id="n_topic" list="topicList2" value="${esc(pv ? pv.topic : sub ? sub.topic : '')}">
          <datalist id="topicList2">${[...new Set(blocks.map(b => b.topic))].map(t => `<option value="${esc(t)}">`).join('')}</datalist></div>
        <div class="two"><div class="field"><label for="n_src">Fonte</label><input id="n_src" value="${esc(pv ? pv.srcTitle : sub ? sub.source_title : '')}"></div>
          <div class="field"><label for="n_srcd">Edição, capítulo, páginas</label><input id="n_srcd" value="${esc(pv ? pv.srcDetail : sub ? [sub.source_detail, sub.pages && 'pp. ' + sub.pages].filter(Boolean).join(', ') : '')}"></div></div>`}
        <div class="field"><label for="n_json">Cartões (JSON)</label><textarea id="n_json" placeholder='{"cards":[{"q":"…","a":"…"}]}'>${esc(view.json || '')}</textarea></div>
        <button class="btn btn-ghost" type="button" id="checkJson">Pré-visualizar</button>
        ${pv ? `<p class="small">${plural(pv.cards.length, 'cartão pronto', 'cartões prontos')} a publicar:</p>
          <div class="list">${pv.cards.slice(0, 50).map(c => `<div class="gen-card"><div class="q">${md(c.q)}</div><div>${md(c.a)}</div>${c.note ? `<div class="muted small">${md(c.note)}</div>` : ''}</div>`).join('')}</div>
          <button class="btn btn-primary" type="submit" id="publish">${target ? 'Acrescentar ao bloco' : 'Publicar na biblioteca'}</button>` : ''}
      </form>`;
    }
    app.innerHTML = html;

    app.querySelectorAll('[data-tab]').forEach(el => el.onclick = () => go({ name: 'dev', tab: el.dataset.tab }));
    app.querySelectorAll('[data-pdf]').forEach(el => el.onclick = async () => {
      const s = allSubs.find(x => x.id === el.dataset.pdf);
      const w = window.open('', '_blank');
      const { data, error } = await sb.storage.from('submissions').createSignedUrl(s.pdf_path, 3600);
      if (error) { if (w) w.close(); return showToast(errMsg(error)); }
      if (w) w.location = data.signedUrl; else location.href = data.signedUrl;
    });
    app.querySelectorAll('[data-gen]').forEach(el => el.onclick = () => go({ name: 'dev', tab: 'new', sub: el.dataset.gen, backTo: { name: 'dev', tab: 'subs' } }));
    app.querySelectorAll('[data-reject]').forEach(el => el.onclick = async () => {
      const id = el.dataset.reject, note = ($('note_' + id) || {}).value || '';
      const { error } = await sb.from('submissions').update({ status: 'rejected', review_note: note, reviewed_at: new Date().toISOString() }).eq('id', id);
      if (error) return showToast(errMsg(error));
      const s = allSubs.find(x => x.id === id); Object.assign(s, { status: 'rejected', review_note: note, reviewed_at: new Date().toISOString() });
      render(); showToast('Envio rejeitado');
    });
    app.querySelectorAll('[data-approve]').forEach(el => el.onclick = async () => {
      const { error } = await sb.from('profiles').update({ approved: true }).eq('id', el.dataset.approve);
      if (error) return showToast(errMsg(error));
      profiles.find(p => p.id === el.dataset.approve).approved = true; render(); showToast('Conta aprovada');
    });
    app.querySelectorAll('[data-revoke]').forEach(el => el.onclick = async () => {
      const id = el.dataset.revoke;
      if (view.confirmRevoke !== id) { view = { ...view, confirmRevoke: id }; return render(); }
      const { error } = await sb.from('profiles').update({ approved: false }).eq('id', id);
      if (error) return showToast(errMsg(error));
      profiles.find(p => p.id === id).approved = false; view = { ...view, confirmRevoke: null }; render(); showToast('Acesso retirado');
    });

    const nf = $('newForm');
    if (nf) {
      const keep = () => { view.json = $('n_json').value;
        if (view.preview && $('n_title')) Object.assign(view.preview, { title: $('n_title').value, topic: $('n_topic').value, srcTitle: $('n_src').value, srcDetail: $('n_srcd').value }); };
      nf.oninput = keep;
      on('checkJson', () => {
        keep();
        try {
          const p = parseCards(view.json);
          if ($('n_title')) { p.title = $('n_title').value || p.title; p.topic = $('n_topic').value || p.topic; p.srcTitle = $('n_src').value || p.srcTitle; p.srcDetail = $('n_srcd').value || p.srcDetail; }
          view.preview = p; render();
        } catch (err) { view.preview = null; render(); showToast(esc(err.message)); }
      });
      nf.onsubmit = async e => {
        e.preventDefault(); keep(); const p = view.preview; if (!p) return;
        const btn = $('publish'); btn.disabled = true;
        const target = view.target ? blocks.find(b => b.id === view.target) : null;
        if (target) {
          const ids = new Set((target.cards || []).map(c => c.id));
          const add = p.cards.map(c => ids.has(c.id) ? { ...c, id: 'c' + rid() } : c);
          const cards = [...(target.cards || []), ...add];
          const { error } = await sb.from('blocks').update({ cards }).eq('id', target.id);
          if (error) { btn.disabled = false; return showToast(errMsg(error)); }
          target.cards = cards; showToast(plural(add.length, 'cartão acrescentado', 'cartões acrescentados')); return go({ name: 'library' });
        }
        if (!p.title.trim() || !p.topic.trim() || !p.srcTitle.trim()) { btn.disabled = false; return showToast('Preenche o nome do bloco, o tema e a fonte.'); }
        const sub = view.sub ? allSubs.find(s => s.id === view.sub) : null;
        const row = { title: p.title.trim(), topic: p.topic.trim(), source_title: p.srcTitle.trim(), source_detail: (p.srcDetail || '').trim(), cards: p.cards,
          author: sub ? sub.author : me.id, submission_id: sub ? sub.id : null };
        const { data, error } = await sb.from('blocks').insert(row).select().single();
        if (error) { btn.disabled = false; return showToast(errMsg(error)); }
        blocks.push(data);
        if (sub) {
          await sb.from('submissions').update({ status: 'approved', block_id: data.id, reviewed_at: new Date().toISOString() }).eq('id', sub.id);
          Object.assign(sub, { status: 'approved', block_id: data.id, reviewed_at: new Date().toISOString() });
        }
        showToast('Bloco publicado na biblioteca'); go({ name: 'library' });
      };
    }
  }

  // ---------- arranque ----------
  if (!sb) { render(); return; }
  sb.auth.onAuthStateChange((event, s) => {
    if (event === 'PASSWORD_RECOVERY') { view = { name: 'auth', mode: 'recover' }; return render(); }
    if (event === 'SIGNED_IN' && me && me.approved && s && s.user && s.user.id === me.id) return; // a mesma sessão a reaparecer
    if (event === 'SIGNED_IN' || event === 'SIGNED_OUT' || event === 'INITIAL_SESSION') setTimeout(() => startSession(s), 0);
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && me && me.approved && ['home', 'library', 'archive', 'block'].includes(view.name)) refresh(false);
  });
})();
</script>
</body>
</html>
