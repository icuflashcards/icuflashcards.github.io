<style>
html, body { margin: 0; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
/* Layout: uma coluna central (máx. 720px) sobre Moroccan Blue (Pantone 19-4241 TCX); o cartão é uma folha pautada amarela com margens vermelhas. Visual único, igual em modo claro e escuro. */
:root {
  --bg: #0f4e67; /* Pantone 19-4241 TCX Moroccan Blue */
  --surface: rgba(255,255,255,0.08);
  --surface-hi: rgba(255,255,255,0.14);
  --ink: #ffffff;
  --muted: rgba(255,255,255,0.72);
  --line: rgba(255,255,255,0.22);
  --btn: #ffffff;
  --btn-ink: #0b3a4d;
  --grey: #e6e8eb; --grey-line: #c9ced3; --grey-ink: #2b3035;
  --paper: #fdf3b8;
  --paper-ink: #2a2614;
  --paper-muted: #6b6343;
  --paper-rule: #9fc0e3;
  --paper-margin: #d9454a;
  --again: #ffa0a0; --hard: #ffd27a; --good: #9be8b2; --easy: #ffffff;
  --font: Calibri, "Carlito", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}

html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 720px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-weight: 700; font-size: 2rem; line-height: 1.1; }
h2 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 700; }
h3 { font-size: 1.1rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }
.num { font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:disabled { cursor: default; }
button:focus-visible, .deck:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #ffffff; outline-offset: 2px; }

.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.today { display: flex; gap: 20px; }
.today div { display: flex; flex-direction: column; }
.today b { font-size: 1.6rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.today span { font-size: 0.78rem; color: var(--muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px;
  border-radius: 10px; font-weight: 700; text-align: center; }
.btn-primary { background: var(--btn); color: var(--btn-ink); }
.btn-primary:disabled, .btn-ghost:disabled, .btn-grey:disabled { opacity: 0.5; }
.btn-ghost { border: 1px solid var(--line); background: var(--surface); }
.btn-grey { background: var(--grey); color: var(--grey-ink); border: 1px solid var(--grey-line); }
.btn-sm { min-height: 36px; padding: 0 12px; font-size: 0.9rem; border-radius: 8px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 180px; }
.nav { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.nav-cards { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
@media (max-width: 520px) { .nav { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* Objetivos */
.goals { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.goal { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: baseline; }
.goal .g-label { font-weight: 700; }
.goal .g-val { font-variant-numeric: tabular-nums; font-size: 0.92rem; color: var(--muted); white-space: nowrap; }
.goal .g-val b { color: var(--ink); font-size: 1.05rem; }
.goal .gbar { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.goal .gbar i { display: block; height: 100%; background: #ffffff; border-radius: 4px; transition: width .3s; }
.goal.met .gbar i { background: var(--good); }
.goal.met .g-val { color: var(--good); }
.goals-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 0.88rem; color: var(--muted); }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end; height: 140px; padding-top: 18px; }
.week .d { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; min-width: 0; }
.week .col { width: 100%; max-width: 34px; background: var(--surface-hi); border-radius: 4px 4px 0 0; position: relative; min-height: 2px; }
.week .col.met { background: var(--good); }
.week .col.today { outline: 1px solid #ffffff; }
.week .n { font-size: 0.75rem; font-variant-numeric: tabular-nums; color: var(--muted); }
.week .wd { font-size: 0.75rem; color: var(--muted); }
.week-wrap { position: relative; }
.week-wrap .target { position: absolute; left: 0; right: 0; border-top: 1px dashed rgba(255,255,255,0.55); pointer-events: none; }
.week-wrap .target span { position: absolute; right: 0; top: -16px; font-size: 0.72rem; color: var(--muted); }
.goal-input { display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.goal-input:last-child { border-bottom: 0; }
.goal-input input { font: inherit; color: var(--ink); background: rgba(0,0,0,0.18); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-height: 44px; width: 100%; box-sizing: border-box; text-align: right; font-variant-numeric: tabular-nums; }
.goal-input input::placeholder { color: rgba(255,255,255,0.45); }
.goal-input .t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.goal-input .t span { font-size: 0.82rem; color: var(--muted); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; grid-column: 1 / -1; }
.chip { font-size: 0.85rem; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-variant-numeric: tabular-nums; }
.chip.on { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); font-weight: 700; }
.sess-goal { font-size: 0.88rem; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; }
.sess-goal.met { color: var(--good); font-weight: 700; }
.nav .btn { flex-direction: column; gap: 4px; min-height: 72px; padding: 8px; font-size: 0.92rem; }
.nav svg { width: 22px; height: 22px; }
@media (max-width: 420px) { .nav .btn { font-size: 0.85rem; } }

.group { display: flex; flex-direction: column; gap: 8px; }
.group-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.decks { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.deck { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 14px 16px; text-align: left; width: 100%;
  border-bottom: 1px solid var(--line); }
.deck:last-child { border-bottom: 0; }
button.deck:hover { background: var(--surface-hi); }
.deck-name { font-weight: 700; font-size: 1.05rem; min-width: 0; }
.deck-meta { grid-column: 1 / -1; display: flex; gap: 6px 14px; font-size: 0.85rem; color: var(--muted); flex-wrap: wrap; min-width: 0; }
.deck-actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.pill { font-size: 0.82rem; padding: 2px 9px; border-radius: 999px; align-self: start; white-space: nowrap; font-weight: 700; font-variant-numeric: tabular-nums; }
.pill.due { background: var(--btn); color: var(--btn-ink); }
.pill.ok { background: var(--surface-hi); color: var(--good); }
.pill.plain { background: var(--surface-hi); color: var(--ink); }
.pill.pending { background: var(--hard); color: #3d2a00; }
.pill.approved { background: var(--good); color: #0e3b1f; }
.pill.rejected { background: var(--again); color: #4a0d10; }
.pill.hidden-b { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
.bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .m { background: var(--good); } .bar .l { background: rgba(155,232,178,0.45); }

.empty, .panel { border: 1px dashed var(--line); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.panel { border-style: solid; }
.empty h3 { font-size: 1.25rem; }
.notice { border-radius: 10px; padding: 12px 14px; background: rgba(255,210,122,0.16); border: 1px solid rgba(255,210,122,0.5); font-size: 0.92rem; }
.dev-band { border: 1px solid rgba(255,255,255,0.35); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;
  background: repeating-linear-gradient(135deg, rgba(255,255,255,0.05) 0 10px, transparent 10px 20px); }
.dev-band h2 { color: var(--ink); }

.back { align-self: flex-start; color: var(--muted); font-size: 0.95rem; padding: 6px 0; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.stats div { background: var(--bg); background-image: linear-gradient(var(--surface), var(--surface)); padding: 12px; display: flex; flex-direction: column; }
.stats b { font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.stats span { font-size: 0.78rem; color: var(--muted); }
@media (max-width: 420px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.list { display: flex; flex-direction: column; gap: 8px; }
details.ci { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
details.ci summary { padding: 12px 14px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; list-style: none; }
details.ci summary::-webkit-details-marker { display: none; }
details.ci summary .q { flex: 1; min-width: 0; }
details.ci .a { padding: 12px 14px 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
details.ci .a ul { margin: 4px 0; padding-left: 1.2em; }
.state { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
.del-link, .restore-link { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 0.88rem; color: var(--ink);
  padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
.restore-link { background: var(--grey); color: var(--btn-ink); border-color: var(--grey-line); font-weight: 700; }
.del-link svg { width: 16px; height: 16px; }
.filters { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
@media (max-width: 520px) { .filters { grid-template-columns: 1fr; } }
.filters input, .filters select { font: inherit; color: var(--ink); background: rgba(0,0,0,0.18); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-height: 44px; width: 100%; box-sizing: border-box; }
.filters input::placeholder { color: rgba(255,255,255,0.5); }
.filters select option { color: #111; }
.selbar { position: sticky; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 5; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  background: var(--bg); border: 1px solid rgba(255,255,255,0.4); border-radius: 12px; padding: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.selbar .count { font-weight: 700; flex: 1 1 100%; }
.selbar .btn { flex: 1 1 140px; }
.selrow { display: grid; grid-template-columns: 44px minmax(0, 1fr); border-bottom: 1px solid var(--line); }
.selrow:last-child { border-bottom: 0; }
.selrow > .deck { border-bottom: 0; padding-left: 4px; }
.selrow .tick { display: flex; align-items: flex-start; justify-content: center; padding-top: 16px; cursor: pointer; }
.selrow .tick input { width: 22px; height: 22px; accent-color: #ffffff; cursor: pointer; }
.selrow.on { background: var(--surface-hi); }
.linkish { color: var(--muted); text-decoration: underline; font-size: 0.9rem; padding: 2px 0; }
.arch-deck { font-size: 1rem; font-weight: 700; margin-top: 4px; }

/* Formulários */
.form { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-weight: 700; font-size: 0.95rem; }
.field .hint-t { font-size: 0.82rem; color: var(--muted); }
.field input, .field select, .field textarea { font: inherit; color: var(--ink); background: rgba(0,0,0,0.18); border: 1px solid var(--line);
  border-radius: 8px; padding: 10px 12px; min-height: 44px; width: 100%; box-sizing: border-box; }
.field input::placeholder { color: rgba(255,255,255,0.45); }
.field input[type=file] { padding: 8px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.progress-box { display: flex; flex-direction: column; gap: 8px; }
.pbar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.pbar i { display: block; height: 100%; background: #ffffff; transition: width .3s; }
.gen-card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; }
.gen-card .q { font-weight: 700; }
.gen-card ul { margin: 2px 0; padding-left: 1.2em; }
.gen-card.out { opacity: 0.45; }
.gen-card.out .q { text-decoration: line-through; }

/* Estudo */
.study-head { display: flex; align-items: center; gap: 12px; }
.study-head .progress { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.study-head .progress i { display: block; height: 100%; background: #ffffff; transition: width .25s; }
.close { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 1.1rem; }

.flash { position: relative; background-color: var(--paper); color: var(--paper-ink); border-radius: 4px; min-height: 52vh;
  display: flex; flex-direction: column; cursor: pointer; overflow: hidden;
  box-shadow: 0 2px 4px rgba(0,0,0,.18), 0 14px 32px rgba(5,15,45,.35);
  background-image: linear-gradient(to right, transparent 46px, var(--paper-margin) 46px, var(--paper-margin) 48px, transparent 48px);
  background-repeat: no-repeat; }
.flash::before { content: ""; position: absolute; left: 0; right: 0; top: 54px; height: 2px; background: var(--paper-margin); }
.flash::after { content: ""; position: absolute; right: 46px; top: 0; bottom: 0; width: 2px; background: var(--paper-margin); opacity: .55; }
.flash-top { position: relative; z-index: 1; height: 54px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 0 10px 0 60px; font-size: 0.82rem; color: var(--paper-muted); background: var(--paper); }
.flash-top .deck-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flash-top .right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.trash { width: 36px; height: 36px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: var(--paper-muted); }
.trash:hover { background: rgba(107,99,67,0.14); }
.trash svg { width: 18px; height: 18px; }
/* Todo o texto do cartão usa o mesmo corpo e a mesma entrelinha (32px), e os blocos separam-se por múltiplos de 32px,
   para que cada linha de texto assente numa linha da folha. --rule-off é medido em JS a partir da base real das letras. */
.flash-body { --lh: 32px; --rule-off: 0px; position: relative; z-index: 1; padding: 22px 60px 32px 62px; display: flex; flex-direction: column; gap: var(--lh); flex: 1;
  font-size: 20px; line-height: var(--lh);
  background-image: linear-gradient(to bottom, transparent calc(var(--lh) - 1px), var(--paper-rule) calc(var(--lh) - 1px), var(--paper-rule) var(--lh));
  background-size: 100% var(--lh); background-repeat: repeat-y; background-position: 0 var(--rule-off); }
.flash .q, .flash .a, .flash .note, .flash .hint { font-size: 20px; line-height: var(--lh); margin: 0; }
.flash .q { font-weight: 700; }
.flash .a ul { margin: 0; padding-left: 1.2em; }
.flash .a li, .flash .a div, .flash .note div, .flash .q div { line-height: var(--lh); }
.flash .note { color: var(--paper-muted); font-style: italic; }
.hint { text-align: center; color: var(--paper-muted); }
.baseline-probe { display: inline-block; width: 0; height: 0; vertical-align: baseline; }
@media (max-width: 420px) { .flash-body { padding: 22px 22px 32px 60px; } .flash::after { display: none; } }

.grades { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.grade { min-height: 64px; border-radius: 10px; border: 1px solid var(--grey-line); background: var(--grey); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 700; font-size: 0.98rem; }
.grade small { font-weight: 400; font-size: 0.78rem; color: #5a6168; font-variant-numeric: tabular-nums; }
.grade:hover { background: #f0f1f3; }
.grade[data-g="0"] { color: #b3262d; } .grade[data-g="1"] { color: #9a5a00; }
.grade[data-g="2"] { color: #1d7a43; } .grade[data-g="3"] { color: #0b3a4d; }
.reveal { width: 100%; background: var(--grey); color: var(--grey-ink); border: 1px solid var(--grey-line); }

.done { text-align: center; align-items: center; padding-top: 40px; }
.foot { font-size: 0.85rem; color: var(--muted); }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 0.95rem; }
.setting select { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  background: #ffffff; color: var(--btn-ink); border-radius: 12px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,.3); max-width: calc(100% - 32px); font-weight: 700; }
.toast[hidden] { display: none; }
.toast button { background: var(--btn-ink); color: #ffffff; border-radius: 8px; padding: 8px 14px; font-weight: 700; }
/* ICU Study: início, perguntas (folha de respostas com bolhas tipo leitura ótica) e progresso por tema */
:root {
  --sheet: #fbfbf7; --sheet-ink: #1f2b31; --sheet-muted: #5b6870; --sheet-line: #d7dee2; --sheet-tint: #eef3f5;
  --ok: #1d7a43; --ok-bg: #e3f4e9; --ko: #b3262d; --ko-bg: #fbe7e7; --half: #8a5300; --half-bg: #fdf0d8;
  --font-q: "Source Serif 4", Georgia, "Times New Roman", serif;
}
.hub-head { display: flex; flex-direction: column; gap: 4px; }
.hub-head h1 { font-size: 2.4rem; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 16px; min-height: 132px; text-align: left;
  border-radius: 14px; border: 1px solid var(--line); background: var(--surface); }
.tile:hover { background: var(--surface-hi); }
.tile svg { width: 26px; height: 26px; margin-bottom: 6px; }
.tile-t { font-weight: 700; font-size: 1.2rem; }
.tile-m { font-size: 0.9rem; color: var(--muted); }
.tile-m b { color: var(--ink); }
.tile.wide { grid-column: 1 / -1; min-height: 0; }
.cd-line { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.goal-input input.txt { text-align: left; }
.goal-input:has(.txt) { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); }
.btn > svg { width: 20px; height: 20px; flex-shrink: 0; }
div.deck { box-sizing: border-box; }
.cov { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.cov-bar { display: block; height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; width: 100%; }
.cov-bar i { display: block; height: 100%; background: var(--good); border-radius: 5px; }
.cov.big .cov-bar { height: 12px; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 0.95rem; border-top: 1px solid var(--line); padding-top: 8px; }
.kv span { color: var(--muted); }

.panel h2, .goals h2 { margin-bottom: 2px; }

      const wasCurrent = session.queue[0] && session.queue[0].b.id === blockId && session.queue[0].c.id === cardId;
      const before = session.queue.length;
      session.queue = session.queue.filter(it => !(it.b.id === blockId && it.c.id === cardId));
      session.total -= Math.min(1, before - session.queue.length);
      if (wasCurrent) session.flipped = false;
    }
    saveArchive(); render();
    if (value) showToast('Cartão arquivado', withUndo ? 'Anular' : null, () => setArchived(blockId, cardId, false, false));
    else showToast('Cartão reposto no bloco');
  }

  // ---------- ações do developer ----------
  async function devUpdateBlock(id, patch, msg) {
    const { error } = await sb.from('blocks').update(patch).eq('id', id);
    if (error) return showToast('Não foi possível guardar a alteração.');
    const b = blocks.find(x => x.id === id); if (b) Object.assign(b, patch);
    render(); if (msg) showToast(msg);
  }
  async function devDeleteBlock(id) {
    const { error } = await sb.from('blocks').delete().eq('id', id);
    if (error) return showToast('Não foi possível apagar o bloco.');
    blocks = blocks.filter(b => b.id !== id); imported = imported.filter(x => x !== id); synced.imported.delete(id); delete blockMap[id];
    render(); showToast('Bloco apagado da biblioteca');
  }

  // ---------- estudo ----------
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function startSession(list, everything) {
    const now = Date.now(), dueQ = [], newQ = [];
    for (const b of list) {
      const pr = progress[b.id] || {};
      let nCount = 0;
      for (const c of activeCards(b)) {
        const p = pr[c.id];
        if (everything) { (p ? dueQ : newQ).push({ b, c }); continue; }
        if (!p) { if (nCount < newPerSession) { newQ.push({ b, c }); nCount++; } }
        else if (p.due <= now) dueQ.push({ b, c });

    }

  function grade(g) {
    const item = session.queue.shift(), { b, c } = item;

  function renderDone() {

  // ---------- perguntas: banco, pontuação e registo ----------
  const LET = ['A', 'B', 'C', 'D', 'E'];
  const visibleQSets = () => qsets.filter(s => !s.hidden || devMode);
  function allQuestions() {
    const out = [];
    for (const s of visibleQSets()) for (const q of (s.questions || [])) {

  // Tipo A: 1 ou 0. Tipo K (como no EDIC): todas as afirmações certas 1, uma errada 0,5, mais 0.
  function scoreQ(q, a) {
    if (q.t === 'K') {
      if (!Array.isArray(a) || !Array.isArray(q.ans)) return 0;
      const wrong = q.ans.filter((v, i) => a[i] !== v).length;
      return wrong === 0 ? 1 : wrong === 1 && q.ans.length >= 4 ? 0.5 : 0;
    }
    return a === q.ans ? 1 : 0;
  }
  const isAnswered = (q, a) => q.t === 'K'
    ? Array.isArray(a) && q.opts.every((_, i) => a[i] === true || a[i] === false)
    : Number.isInteger(a);
  const fmtPts = n => String(+n.toFixed(1)).replace('.', ',');
  const pct = (s, n) => n ? Math.round(s / n * 100) : 0;
  const mmss = ms => { const t = Math.max(0, Math.round(ms / 1000)); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
    return (h ? h + ':' + pad2(m) : m) + ':' + pad2(s); };

  function qPeriod() {
    const tk = todayKey(), wk = weekDays();
    let wn = 0, ws = 0;
    for (const [k, d] of Object.entries(qlog)) if (wk.includes(k)) { wn += d.n || 0; ws += d.s || 0; }
    const d = qlog[tk] || { n: 0, s: 0 };

  }
  function qTotals() {
    let n = 0, s = 0;

  function recordAnswers(items) {
    if (!items.length) return;
    const before = qPeriod(), k = todayKey();
    const day = { n: 0, s: 0, ...(qlog[k] || {}) };
    for (const { q, a } of items) {
      const sc = scoreQ(q, a);

  // ---------- progresso por tema ----------
  function subQStats() {
    const m = {};
    for (const id of SUB_ORDER) m[id] = { avail: 0, n: 0, s: 0, seen: 0 };

  function subCardStats() {
    const m = {};

    for (const b of blocks) {
      if (b.hidden) continue;

      let seen = 0, mas = 0;
      for (const c of cards) { const p = pr[c.id]; if (p) { seen++; if (p.i >= 21) mas++; } }
      for (const sid of subs) { const x = m[sid]; if (!x) continue; x.total += cards.length; x.seen += seen; x.mastered += mas; x.blocks.push(b); }
    }
    return m;
  }
  function subStatus(id, qs, cs) {

  }

  // ---------- vista: configurar sessão de perguntas ----------
  const QCFG0 = { mode: 'treino', n: 20, types: { A: true, K: true }, timer: 0, filter: 'all', subs: [] };

  const FILTERS = [['all', 'Todas'], ['new', 'Nunca respondidas'], ['wrong', 'Erradas da última vez'], ['weak', 'Temas abaixo do objetivo']];
  function buildPool(cfg) {

      for (const d of TAXO) {

        for (const [gid] of d.groups) {

            ${g.subs.map(s => `<label class="sub ${avail[s.id] ? '' : 'none'}"><input type="checkbox" data-ssel="${s.id}" ${sel.has(s.id) ? 'checked' : ''}>
              <span class="pri p${s.pri}">${s.pri}</span><span class="sub-l">${esc(s.label)}</span><span class="num muted small">${avail[s.id] || 0}</span></label>`).join('')}
          </div></details>`;

      }
      html += `</section>
        <div class="selbar"><span class="count">${pool.length ? `${plural(pool.length, 'pergunta disponível', 'perguntas disponíveis')} com esta escolha` : 'Nenhuma pergunta com esta escolha'}</span>
          <button class="btn btn-primary" id="qstart" ${n ? '' : 'disabled'}>${n ? `Começar ${qcfg.mode} · ${n}` : 'Muda os filtros'}</button></div>`;
    }
    app.innerHTML = html;
    app.querySelectorAll('[data-mixed]').forEach(c => { c.indeterminate = true; });
    const upd = patch => { qcfg = { ...qcfg, ...patch }; saveCfg(); render(); };
    app.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => upd({ mode: b.dataset.mode, timer: b.dataset.mode === 'exame' && qcfg.mode !== 'exame' && !+qcfg.timer ? 1.8 : qcfg.timer }));
    app.querySelectorAll('[data-qn]').forEach(b => b.onclick = () => upd({ n: +b.dataset.qn }));
    const qn = document.getElementById('qn');
    if (qn) { qn.onchange = () => upd({ n: Math.max(1, Math.min(500, Math.round(+qn.value || 1))) }); qn.onkeydown = e => { if (e.key === 'Enter') qn.blur(); }; }

      const t = { ...qcfg.types, [b.dataset.qt]: !qcfg.types[b.dataset.qt] };

        const allIn = ids.every(id => s.has(id));
        ids.forEach(id => allIn ? s.delete(id) : s.add(id));
        upd({ subs: SUB_ORDER.filter(id => s.has(id)) });

      const s = new Set(qcfg.subs); c.checked ? s.add(c.dataset.ssel) : s.delete(c.dataset.ssel);
      upd({ subs: SUB_ORDER.filter(id => s.has(id)) });

    on('qstart', () => startQuiz(pool, qcfg));
  }

  // ---------- sessão de perguntas ----------
  let qTick = null;
  function startQuiz(list, cfg) {
    const unseen = shuffle(list.filter(q => !qstats[q.k])), seen = shuffle(list.filter(q => qstats[q.k]));
    const qs = shuffle([...unseen, ...seen].slice(0, cfg.n));
    if (!qs.length) return;
    qrun = { mode: cfg.mode, qs, ans: qs.map(() => null), conf: qs.map(() => false), flags: new Set(), idx: 0,
      start: Date.now(), limit: +cfg.timer ? Math.round(cfg.timer * 60000 * qs.length) : 0, ask: null, showGrid: false };
    go({ name: 'qrun' });
    clearInterval(qTick);
    qTick = setInterval(tick, 1000);
  }
  function tick() {
    if (!qrun || qrun.end) { clearInterval(qTick); return; }
    const el = document.getElementById('qclock');
    const used = Date.now() - qrun.start;
    if (qrun.limit) {
      const left = qrun.limit - used;
      if (left <= 0) { finishQuiz(true); return; }
      if (el) { el.textContent = mmss(left); el.classList.toggle('warn', left < 60000); }
    } else if (el) el.textContent = mmss(used);
  }
  function optsHtml(q, a, reveal, live) {
    if (q.t === 'K') {
      return `<div class="klist"><div class="khead" aria-hidden="true"><span></span><span>V</span><span>F</span></div>
        ${q.opts.map((o, i) => {
          const mine = Array.isArray(a) ? a[i] : undefined, right = Array.isArray(q.ans) ? q.ans[i] : undefined;
          const cls = v => ['bub', mine === v ? 'on' : '', reveal && right === v ? 'right' : '', reveal && mine === v && right !== v ? 'wrong' : ''].join(' ');
          return `<div class="kst ${reveal ? (mine === right ? 'ok' : 'ko') : ''}"><span class="kt"><b>${LET[i]}.</b> ${md(o).replace(/^<div>|<\/div>$/g, '')}</span>
            <button class="${cls(true)}" ${live ? `data-k="${i}" data-v="1"` : 'disabled'} aria-label="${LET[i]} verdadeira" aria-pressed="${mine === true}">V</button>
            <button class="${cls(false)}" ${live ? `data-k="${i}" data-v="0"` : 'disabled'} aria-label="${LET[i]} falsa" aria-pressed="${mine === false}">F</button></div>`;
        }).join('')}</div>`;
    }
    return `<div class="olist">${q.opts.map((o, i) => {
      const cls = ['opt', a === i ? 'on' : '', reveal && q.ans === i ? 'right' : '', reveal && a === i && q.ans !== i ? 'wrong' : ''].join(' ');
      return `<button class="${cls}" ${live ? `data-o="${i}"` : 'disabled'} aria-pressed="${a === i}"><span class="bub">${LET[i]}</span><span class="ot">${md(o).replace(/^<div>|<\/div>$/g, '')}</span></button>`;
    }).join('')}</div>`;
  }
  const verdict = sc => sc === 1 ? ['ok', 'Certa', '1 ponto'] : sc === 0.5 ? ['half', 'Meia certa', '0,5 pontos'] : ['ko', 'Errada', '0 pontos'];
  function explainHtml(q, a) {
    const [cls, t, p] = verdict(scoreQ(q, a));
    const src = [q.set && q.set.source && q.set.source.title, q.ref].filter(Boolean).join(' · ');
    return `<div class="verdict ${cls}"><b>${isAnswered(q, a) ? t : 'Sem resposta'}</b><span>${p}</span></div>
      <div class="expl">${md(q.exp || 'Sem justificação.')}</div>
      <p class="src">${SUBS[q.sub] ? esc(SUBS[q.sub].label) : ''}${src ? ` · Fonte: ${esc(src)}` : ''}</p>`;
  }
  function renderQRun() {
    if (!qrun) return go({ name: 'qhome' });
    const r = qrun, q = r.qs[r.idx], a = r.ans[r.idx], train = r.mode === 'treino';
    const confirmed = train && r.conf[r.idx], last = r.idx === r.qs.length - 1;
    const answeredN = r.qs.filter((x, i) => isAnswered(x, r.ans[i])).length;
    const used = Date.now() - r.start;
    const progress = train ? r.conf.filter(Boolean).length : answeredN;
    let html = `<div class="study-head"><button class="close" id="qquit" aria-label="Sair da sessão">✕</button>
        <div class="progress"><i style="width:${progress / r.qs.length * 100}%"></i></div>
        <span class="num muted">${r.idx + 1}/${r.qs.length}</span>
        <span class="clock num ${r.limit && r.limit - used < 60000 ? 'warn' : ''}" id="qclock" aria-label="${r.limit ? 'Tempo que falta' : 'Tempo de sessão'}">${mmss(r.limit ? r.limit - used : used)}</span></div>`;
    if (r.ask === 'quit') {
      html += `<div class="panel"><h3>${train ? 'Terminar o treino?' : 'Sair sem entregar?'}</h3>
        <p class="muted">${train ? `As ${plural(r.conf.filter(Boolean).length, 'pergunta corrigida fica', 'perguntas corrigidas ficam')} registadas.` : 'As respostas deste exame não ficam registadas.'}</p>
        <div class="row"><button class="btn btn-primary" id="askYes">${train ? 'Terminar e ver resultados' : 'Sair sem entregar'}</button><button class="btn btn-ghost" id="askNo">Continuar</button></div></div>`;
    } else if (r.ask === 'submit') {
      const miss = r.qs.length - answeredN;
      html += `<div class="panel"><h3>Entregar o exame?</h3>
        <p class="muted">${miss ? `Tens ${plural(miss, 'pergunta', 'perguntas')} por responder, que contam 0. ` : 'Respondeste a todas. '}${r.flags.size ? `${plural(r.flags.size, 'pergunta marcada', 'perguntas marcadas')} para rever.` : ''}</p>
        <div class="row"><button class="btn btn-primary" id="askYes">Entregar e ver correção</button><button class="btn btn-ghost" id="askNo">Voltar às perguntas</button></div></div>`;
    }
    html += `<article class="sheet">
        <div class="sheet-top"><span>Pergunta ${r.idx + 1} · ${q.t === 'K' ? 'V/F tipo K' : 'Escolha múltipla'}</span>
          ${train ? '' : `<button class="flag ${r.flags.has(r.idx) ? 'on' : ''}" id="qflag" aria-pressed="${r.flags.has(r.idx)}">${r.flags.has(r.idx) ? 'Marcada' : 'Marcar para rever'}</button>`}</div>
        <div class="stem">${md(q.stem)}</div>
        <p class="ins">${q.t === 'K' ? 'Classifica cada afirmação como verdadeira ou falsa.' : 'Escolhe a melhor resposta.'}</p>
        ${optsHtml(q, a, confirmed, !confirmed)}
        ${confirmed ? explainHtml(q, a) : ''}

    if (train) {
      html += confirmed

    } else {
      html += `<div class="row qnav"><button class="btn btn-ghost" id="qprev" ${r.idx ? '' : 'disabled'}>Anterior</button>
          ${last ? `<button class="btn btn-primary" id="qsubmit">Entregar</button>` : `<button class="btn btn-primary" id="qnext">Seguinte</button>`}</div>
        <button class="linkish" id="qgridT" style="align-self:flex-start">${r.showGrid ? 'Esconder grelha' : `Ver grelha · ${answeredN}/${r.qs.length} respondidas`}</button>
        ${r.showGrid ? `<div class="qgrid">${r.qs.map((x, i) => `<button class="${[isAnswered(x, r.ans[i]) ? 'done' : '', r.flags.has(i) ? 'flag' : '', i === r.idx ? 'cur' : ''].join(' ')}" data-jump="${i}" aria-label="Pergunta ${i + 1}">${i + 1}</button>`).join('')}</div>
          <button class="btn btn-ghost btn-sm" id="qsubmit2" style="align-self:flex-start">Entregar agora</button>` : ''}`;
    }
    app.innerHTML = html;
    const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
    const set = v => { r.ans[r.idx] = v; render(); };
    app.querySelectorAll('[data-o]').forEach(b => b.onclick = () => set(+b.dataset.o));
    app.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
      const cur = Array.isArray(r.ans[r.idx]) ? [...r.ans[r.idx]] : q.opts.map(() => null);
      cur[+b.dataset.k] = b.dataset.v === '1'; set(cur);
    });
    on('qquit', () => { r.ask = 'quit'; render(); scrollTo(0, 0); });
    on('askNo', () => { r.ask = null; render(); });
    on('askYes', () => {
      if (r.ask === 'submit') return finishQuiz(false);
      if (train && r.conf.some(Boolean)) return finishQuiz(false);
      clearInterval(qTick); qrun = null; go({ name: 'qhome' });
    });
    on('qconf', () => { r.conf[r.idx] = true; recordAnswers([{ q, a }]); render(); });
    on('qnext', () => {
      if (train && last) return finishQuiz(false);
      r.idx = Math.min(r.qs.length - 1, r.idx + 1); render(); scrollTo(0, 0);
    });
    on('qprev', () => { r.idx = Math.max(0, r.idx - 1); render(); scrollTo(0, 0); });
    on('qflag', () => { r.flags.has(r.idx) ? r.flags.delete(r.idx) : r.flags.add(r.idx); render(); });
    on('qgridT', () => { r.showGrid = !r.showGrid; render(); });
    app.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => { r.idx = +b.dataset.jump; render(); scrollTo(0, 0); });
    const ask = () => { r.ask = 'submit'; render(); scrollTo(0, 0); };
    on('qsubmit', ask); on('qsubmit2', ask);
  }
  function finishQuiz(timeUp) {
    const r = qrun; if (!r || r.end) return;
    clearInterval(qTick);
    r.end = Date.now(); r.timeUp = timeUp; r.ask = null;
    if (r.mode === 'exame') recordAnswers(r.qs.map((q, i) => ({ q, a: r.ans[i] })));
    else if (timeUp) r.idx = r.qs.length - 1;
    go({ name: 'qres' });
    if (timeUp) showToast('O tempo acabou');
  }
  document.addEventListener('keydown', e => {
    if (view.name !== 'qrun' || !qrun || qrun.ask || e.target.matches('input, select, textarea')) return;
    const q = qrun.qs[qrun.idx];
    if (q.t === 'A' && !(qrun.mode === 'treino' && qrun.conf[qrun.idx])) {
      const i = 'abcde'.indexOf(e.key.toLowerCase());
      if (i >= 0 && i < q.opts.length) { qrun.ans[qrun.idx] = i; render(); }
    }
    if (e.key === 'Enter') { const b = document.getElementById('qconf') || document.getElementById('qnext'); if (b && !b.disabled) b.click(); }
  });

  // ---------- resultados ----------
  function renderQRes() {
    const r = qrun;
    if (!r || !r.end) return go({ name: 'qhome' });
    const items = r.qs.map((q, i) => ({ q, a: r.ans[i], i, sc: scoreQ(q, r.ans[i]) })).filter(x => r.mode === 'exame' || r.conf[x.i]);
    const pts = items.reduce((t, x) => t + x.sc, 0), n = items.length, p = pct(pts, n);
    const full = items.filter(x => x.sc === 1).length, half = items.filter(x => x.sc === 0.5).length;
    const f = r.resFilter || 'all';
    const shown = items.filter(x => f === 'all' || (f === 'wrong' && x.sc < 1) || (f === 'flag' && r.flags.has(x.i)));
    const bySub = {};
    items.forEach(x => { const b = bySub[x.q.sub] ||= { n: 0, s: 0 }; b.n++; b.s += x.sc; });
    const met = p >= goals.acc;
    let html = `<div><h2>${r.mode === 'exame' ? 'Exame entregue' : 'Treino terminado'}${r.timeUp ? ' · tempo esgotado' : ''}</h2>
        <h1><span class="num">${fmtPts(pts)}</span> / ${n} pontos</h1>
        <p class="muted" style="margin-top:6px"><span class="num">${p}%</span> · objetivo ${goals.acc}% ${met ? '· <b class="good-t">cumprido</b>' : ''} · ${mmss(r.end - r.start)}</p></div>
      <div class="stats"><div><b>${full}</b><span>certas</span></div><div><b>${half}</b><span>meio ponto</span></div><div><b>${n - full - half}</b><span>erradas</span></div><div><b>${p}%</b><span>acerto</span></div></div>`;
    if (Object.keys(bySub).length > 1) {
      html += `<section class="group"><h2>Por tema</h2><div class="decks">${Object.entries(bySub).sort((a, b) => a[1].s / a[1].n - b[1].s / b[1].n).map(([sid, b]) => {
        const v = pct(b.s, b.n);
        return `<div class="deck"><span class="deck-name small">${esc(SUBS[sid] ? SUBS[sid].label : 'Sem tema')}</span><span class="pill ${v >= goals.acc ? 'ok' : 'plain'} num">${v}%</span>
          <span class="deck-meta"><span class="num">${fmtPts(b.s)} / ${b.n}</span></span></div>`;
      }).join('')}</div></section>`;
    }
    html += `<section class="group"><div class="group-head"><h2>Correção</h2>
        <div class="chips"><button class="chip ${f === 'all' ? 'on' : ''}" data-rf="all">Todas</button><button class="chip ${f === 'wrong' ? 'on' : ''}" data-rf="wrong">Erradas e meias</button>
        ${r.mode === 'exame' && r.flags.size ? `<button class="chip ${f === 'flag' ? 'on' : ''}" data-rf="flag">Marcadas</button>` : ''}</div></div>
      <div class="list">${shown.map(x => {
        const [cls, t] = verdict(x.sc);
        return `<details class="ci rq"><summary><span class="num muted">${x.i + 1}.</span><span class="q">${esc(x.q.stem.length > 140 ? x.q.stem.slice(0, 137) + '…' : x.q.stem)}</span><span class="vpill ${cls}">${isAnswered(x.q, x.a) ? t : 'Sem resposta'}</span></summary>
          <div class="a"><div class="sheet sheet-in"><div class="stem">${md(x.q.stem)}</div>${optsHtml(x.q, x.a, true, false)}${explainHtml(x.q, x.a)}</div></div></details>`;
      }).join('') || `<p class="muted">Nada para mostrar com este filtro.</p>`}</div></section>
      <div class="row">${items.some(x => x.sc < 1) ? `<button class="btn btn-primary" id="redo">Treinar as erradas (${items.filter(x => x.sc < 1).length})</button>` : ''}
        <button class="btn btn-ghost" id="again">Nova sessão</button><button class="btn btn-ghost" id="home">Início</button></div>`;
    app.innerHTML = html;
    app.querySelectorAll('[data-rf]').forEach(b => b.onclick = () => { r.resFilter = b.dataset.rf; render(); });
    const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
    on('redo', () => { const list = items.filter(x => x.sc < 1).map(x => x.q); startQuiz(list, { ...qcfg, mode: 'treino', n: list.length, timer: 0 }); });
    on('again', () => { qrun = null; go({ name: 'qhome' }); });
    on('home', () => { qrun = null; go({ name: 'home' }); });
  }

  // ---------- vista: progresso por tema ----------

  async function beginSession(s) {
    if (recovering && s && s.user) { view = { name: 'auth', mode: 'recover' }; return render(); }
    if (!s || !s.user) { me = null; uid = null; if (!(view.name === 'auth' && view.msg)) view = { name: 'auth', mode: 'login' }; return render(); }
    const { data: prof, error } = await sb.from('profiles').select('*').eq('id', s.user.id).maybeSingle();
    if (error || !prof) { me = { id: s.user.id, email: s.user.email, approved: false, role: 'user', name: '' }; view = { name: 'pending' }; return render(); }
    if (!me || me.id !== s.user.id) resetUserState();
    me = { ...prof, email: s.user.email }; uid = me.id; isOwner = me.role === 'developer';
    if (recovering) { view = { name: 'auth', mode: 'recover' }; return render(); }
    if (!me.approved) { view = { name: 'pending' }; return render(); }

    if (!['home', 'cards', 'library', 'block', 'archive', 'goals', 'qhome', 'track', 'dev'].includes(view.name)) view = { name: 'home' };
    render();
    await refresh(true); render();
  }

  // ---------- painel developer ----------
  function parseCards(text) {
    let data; try { data = JSON.parse(text); } catch { throw new Error('O texto colado não é JSON válido. Copia o bloco completo que o Claude te deu.'); }
    const meta = Array.isArray(data) ? {} : data;
    const list = Array.isArray(data) ? data : data.cards;
    if (!Array.isArray(list) || !list.length) throw new Error('Não encontrei cartões no texto colado.');
    const used = new Set();
    const cards = list.map(c => {
      if (!c || !c.q || !c.a) throw new Error('Há cartões sem pergunta (q) ou sem resposta (a).');
      let id = c.id ? String(c.id) : 'c' + rid(); while (used.has(id)) id = 'c' + rid(); used.add(id);
      return { id, q: String(c.q).trim(), a: String(c.a).trim(), ...(c.note ? { note: String(c.note).trim() } : {}) };
    });
    const src = meta.source || {};
    const subs = Array.isArray(meta.subs) ? meta.subs.filter(x => SUBS[x]) : [];
    return { cards, subs, title: meta.title || '', topic: meta.topic || '', srcTitle: src.title || meta.source_title || '', srcDetail: src.detail || meta.source_detail || '' };
  }
  // Conjunto de perguntas: { id?, title, source: {title, detail}, questions: [{ id, t: 'A'|'K', sub, stem, opts, ans, exp, ref? }] }
  function parseQSet(text) {
    let data; try { data = JSON.parse(text); } catch { throw new Error('O texto colado não é JSON válido.'); }
    const meta = Array.isArray(data) ? {} : data;
    const list = Array.isArray(data) ? data : data.questions;
    if (!Array.isArray(list) || !list.length) throw new Error('Não encontrei perguntas (campo "questions").');
    const errors = [], unknown = new Set(), noExp = [], used = new Set();
    const questions = list.map((q, i) => {
      const n = i + 1, where = `Pergunta ${n}${q && q.id ? ` (${q.id})` : ''}`;
      if (!q || typeof q !== 'object') { errors.push(`${where}: formato inválido`); return null; }
      const t = q.t === 'K' ? 'K' : 'A';
      let id = q.id ? String(q.id) : 'q' + n;
      if (used.has(id)) errors.push(`${where}: id repetido`); used.add(id);
      if (!q.stem || !String(q.stem).trim()) errors.push(`${where}: falta o enunciado (stem)`);
      const opts = Array.isArray(q.opts) ? q.opts.map(o => String(o)) : [];
      if (opts.length < 2 || opts.length > 5) errors.push(`${where}: precisa de 2 a 5 opções (opts)`);
      if (t === 'A' && !(Number.isInteger(q.ans) && q.ans >= 0 && q.ans < opts.length)) errors.push(`${where}: "ans" tem de ser o número da opção certa (0 = A)`);
      if (t === 'K' && !(Array.isArray(q.ans) && q.ans.length === opts.length && q.ans.every(v => v === true || v === false))) errors.push(`${where}: "ans" tem de ter um verdadeiro/falso por afirmação`);
      if (!SUBS[q.sub]) unknown.add(q.sub || '(sem tema)');
      if (!q.exp) noExp.push(id);
      return { id, t, sub: q.sub || '', stem: String(q.stem || '').trim(), opts, ans: q.ans, exp: String(q.exp || '').trim(), ...(q.ref ? { ref: String(q.ref) } : {}) };
    }).filter(Boolean);
    const src = meta.source || {};
    return { id: meta.id ? String(meta.id) : '', title: meta.title || '', srcTitle: src.title || '', srcDetail: src.detail || '', questions, errors, unknown: [...unknown], noExp,
      nA: questions.filter(q => q.t === 'A').length, nK: questions.filter(q => q.t === 'K').length };
  }

          <button class="btn btn-ghost" type="button" id="checkQ">Verificar</button>
          ${qp ? `<div class="notice ${qp.errors.length ? 'err' : 'ok'}"><b>${esc(qp.title || 'Sem título')}</b> · ${plural(qp.questions.length, 'pergunta', 'perguntas')} (${qp.nA} escolha múltipla, ${qp.nK} V/F)${qp.id ? ` · id ${esc(qp.id)}${qsets.some(s => s.id === qp.id) ? ' · <b>substitui o conjunto que já existe</b>' : ''}` : ''}
            ${qp.errors.length ? `<ul class="vlist">${qp.errors.slice(0, 15).map(e => `<li>${esc(e)}</li>`).join('')}${qp.errors.length > 15 ? `<li>e mais ${qp.errors.length - 15}</li>` : ''}</ul>` : ''}
            ${qp.unknown.length ? `<div class="small">Temas desconhecidos (não aparecem no progresso por tema): ${esc(qp.unknown.join(', '))}</div>` : ''}
            ${qp.noExp.length ? `<div class="small">${plural(qp.noExp.length, 'pergunta sem justificação', 'perguntas sem justificação')}.</div>` : ''}</div>
            ${qp.errors.length ? '' : `<button class="btn btn-primary" type="submit" id="qpublish">Publicar ${plural(qp.questions.length, 'pergunta', 'perguntas')}</button>`}` : ''}
        </form></section>`;
    }
    app.innerHTML = html;

    app.querySelectorAll('[data-tab]').forEach(el => el.onclick = () => go({ name: 'dev', tab: el.dataset.tab }));
    app.querySelectorAll('[data-approve]').forEach(el => el.onclick = async () => {
      const { error } = await sb.from('profiles').update({ approved: true }).eq('id', el.dataset.approve);
      if (error) return showToast(errMsg(error));
      profiles.find(p => p.id === el.dataset.approve).approved = true; render(); showToast('Conta aprovada');
    });
    app.querySelectorAll('[data-revoke]').forEach(el => el.onclick = async () => {
      const id = el.dataset.revoke;
      if (view.confirmRevoke !== id) { view = { ...view, confirmRevoke: id }; return render(); }
      const { error } = await sb.from('profiles').update({ approved: false }).eq('id', id);
      if (error) return showToast(errMsg(error));
      profiles.find(p => p.id === id).approved = false; view = { ...view, confirmRevoke: null }; render(); showToast('Acesso retirado');
    });

    const nf = $('newForm');
    if (nf) {
      const keep = () => { view.json = $('n_json').value;
        if (view.preview && $('n_title')) Object.assign(view.preview, { title: $('n_title').value, topic: $('n_topic').value, srcTitle: $('n_src').value, srcDetail: $('n_srcd').value }); };
      nf.oninput = keep;
      on('checkJson', () => {
        keep();
        try {
          const p = parseCards(view.json);
          if ($('n_title')) { p.title = $('n_title').value || p.title; p.topic = $('n_topic').value || p.topic; p.srcTitle = $('n_src').value || p.srcTitle; p.srcDetail = $('n_srcd').value || p.srcDetail; }
          view.preview = p; render();
        } catch (err) { view.preview = null; render(); showToast(esc(err.message)); }
      });
      nf.onsubmit = async e => {
        e.preventDefault(); keep(); const p = view.preview; if (!p) return;
        const btn = $('publish'); btn.disabled = true;
        const target = view.target ? blocks.find(b => b.id === view.target) : null;
        if (target) {
          const ids = new Set((target.cards || []).map(c => c.id));
          const add = p.cards.map(c => ids.has(c.id) ? { ...c, id: 'c' + rid() } : c);
          const cards = [...(target.cards || []), ...add];
          const { error } = await sb.from('blocks').update({ cards }).eq('id', target.id);
          if (error) { btn.disabled = false; return showToast(errMsg(error)); }
          target.cards = cards; view = { name: 'library' }; render(); return showToast(plural(add.length, 'cartão acrescentado', 'cartões acrescentados'));
        }
        if (!p.title.trim() || !p.topic.trim() || !p.srcTitle.trim()) { btn.disabled = false; return showToast('Preenche o nome do bloco, o tema e a fonte.'); }
        const row = { title: p.title.trim(), topic: p.topic.trim(), source_title: p.srcTitle.trim(), source_detail: (p.srcDetail || '').trim(), cards: p.cards, author: uid, subs: p.subs };
        const { data, error } = await sb.from('blocks').insert(row).select().single();
        if (error) { btn.disabled = false; return showToast(errMsg(error)); }
        const nb = rowToBlock(data); blocks.push(nb); if (nb.subs.length) blockMap[nb.id] = nb.subs;
        view = { name: 'library' }; render(); showToast('Bloco publicado na biblioteca');
      };
    }

    const qf = $('qForm');
    if (qf) {
      qf.oninput = () => { view.qjson = $('q_json').value; };
      on('checkQ', () => {
        view.qjson = $('q_json').value;
        try { view.qpreview = parseQSet(view.qjson); } catch (err) { view.qpreview = null; showToast(esc(err.message)); }
        render();
      });
      qf.onsubmit = async e => {
        e.preventDefault(); const p = view.qpreview; if (!p || p.errors.length) return;
        const btn = $('qpublish'); btn.disabled = true;
        const row = { title: p.title || 'Perguntas', source_title: p.srcTitle, source_detail: p.srcDetail, questions: p.questions };
        const res = p.id ? await sb.from('qbank').upsert({ id: p.id, ...row }).select().single() : await sb.from('qbank').insert(row).select().single();
        if (res.error) { btn.disabled = false; return showToast(errMsg(res.error)); }
        const s = rowToQSet(res.data); qsets = [...qsets.filter(x => x.id !== s.id), s].sort((a, b) => a.createdAt - b.createdAt);
        view = { name: 'dev', tab: 'q' }; render(); showToast(plural(s.questions.length, 'pergunta publicada', 'perguntas publicadas'));
      };
    }
    app.querySelectorAll('[data-qhide]').forEach(el => el.onclick = async () => {
      const s = qsets.find(x => x.id === el.dataset.qhide);
      const { error } = await sb.from('qbank').update({ hidden: !s.hidden }).eq('id', s.id);
      if (error) return showToast(errMsg(error));
      s.hidden = !s.hidden; render(); showToast(s.hidden ? 'Conjunto oculto' : 'Conjunto visível para todos');
    });
    app.querySelectorAll('[data-qdel]').forEach(el => el.onclick = async () => {
      const id = el.dataset.qdel;
      if (view.confirmQDel !== id) { view = { ...view, confirmQDel: id }; return render(); }
      const { error } = await sb.from('qbank').delete().eq('id', id);
      if (error) return showToast(errMsg(error));
      qsets = qsets.filter(s => s.id !== id); view = { name: 'dev', tab: 'q' }; render(); showToast('Conjunto apagado');
    });
  }

  // ---------- dados (Supabase) ----------
  const rerender = () => { if (view.name !== 'study' && view.name !== 'qrun' && !document.activeElement?.matches?.('input, select, textarea')) render(); };
  const rowToBlock = r => ({ id: r.id, title: r.title, topic: r.topic, source: { title: r.source_title || '', detail: r.source_detail || '' },
    cards: r.cards || [], author: r.author, hidden: !!r.hidden, createdAt: Date.parse(r.created_at) || 0, subs: Array.isArray(r.subs) ? r.subs : [] });
  const rowToQSet = r => ({ id: r.id, title: r.title, source: { title: r.source_title || '', detail: r.source_detail || '' },
    questions: r.questions || [], hidden: !!r.hidden, createdAt: Date.parse(r.created_at) || 0 });
  async function loadAll() {
    const q = await Promise.all([
      sb.from('blocks').select('*').order('created_at'),
      sb.from('user_blocks').select('block_id').eq('user_id', uid),
      sb.from('progress').select('block_id,cards').eq('user_id', uid),
      sb.from('archives').select('block_id,card_ids').eq('user_id', uid),
      sb.from('profiles').select('id,name,role,approved,created_at').order('created_at')
    ]);
    const err = q.find(r => r.error); if (err) throw err.error;
    blocks = (q[0].data || []).map(rowToBlock);
    blockMap = {}; blocks.forEach(b => { if (b.subs.length) blockMap[b.id] = b.subs; });
    imported = (q[1].data || []).map(r => r.block_id); synced.imported = new Set(imported);
    progress = {}; (q[2].data || []).forEach(r => { progress[r.block_id] = r.cards || {}; });
    // progresso que ficou por enviar (sem rede) tem prioridade
    const pend = store.get(ukey('pendingP'), {});
    Object.entries(pend).forEach(([bid, cards]) => { progress[bid] = cards; dirtyP.add(bid); });
    if (dirtyP.size) { clearTimeout(pTimer); pTimer = setTimeout(flushProgress, 500); }
    myArchive = {}; (q[3].data || []).forEach(r => { if ((r.card_ids || []).length) myArchive[r.block_id] = r.card_ids; });
    synced.archive = JSON.parse(JSON.stringify(myArchive));
    profiles = q[4].data || []; names = {}; profiles.forEach(p => { names[p.id] = p.name || ''; });
    // banco de perguntas (se a tabela ainda não existir, a app funciona só com os flashcards)
    const qb = await sb.from('qbank').select('*').order('created_at');
    qsets = qb.error ? [] : (qb.data || []).map(rowToQSet);
    if (!statsLoaded) {
      const st = await sb.from('study_stats').select('*').eq('user_id', uid).maybeSingle();
      const local = store.get(ukey('stats'), null);
      const row = (!st.error && st.data) ? st.data : local;
      if (row) {
        goals = { ...NO_GOALS, ...(row.goals || {}) }; studyLog = row.log || {};
        qstats = row.qstats || {}; qlog = row.qlog || {}; tmarks = row.marks || {};
      }
      if (!st.error && !st.data && local) saveStats();
      statsLoaded = true;
    }
    loaded = { blocks: true, state: true, q: true };
  }
  async function refresh(silent) {
    try { await loadAll(); if (!silent) rerender(); } catch (e) { if (!silent) showToast(errMsg(e)); }
  }

  if (!sb) { view = { name: 'auth', mode: 'login' }; render(); return; }
  if (linkError) view = { name: 'auth', mode: 'reset', msg: linkError, msgOk: false };
  else view = { name: 'auth', mode: 'login', boot: true };
  render();
  sb.auth.onAuthStateChange((event, s) => {
    if (event === 'PASSWORD_RECOVERY') { recovering = true; view = { name: 'auth', mode: 'recover' }; return render(); }
    if (recovering && event !== 'SIGNED_OUT') { view = { name: 'auth', mode: 'recover' }; return render(); }
    if (event === 'SIGNED_IN' && me && me.approved && s && s.user && s.user.id === me.id) return; // a mesma sessão a reaparecer
    if (event === 'SIGNED_IN' || event === 'SIGNED_OUT' || event === 'INITIAL_SESSION') setTimeout(() => beginSession(s), 0);
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && me && me.approved && ['home', 'cards', 'library', 'archive', 'block', 'track', 'qhome'].includes(view.name)) refresh(false);
  });
})();
</script>
</body>
</html>
